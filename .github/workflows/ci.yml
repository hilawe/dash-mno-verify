name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci --omit=optional

      - name: Syntax check every tracked JS file
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: Validate JSON
        run: |
          node -e "for (const f of ['package.json','contract/mno-verify.contract.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"

      - name: Unit tests
        run: npm test

  # THE FULL INSTALL, which is what actually exercises the adapters. The job above deliberately
  # installs without optional dependencies to prove the oracle and gateway stand alone, and the
  # adapter tests SKIP there. Without this job they would skip everywhere and the Discord adapter,
  # which twelve review rounds were spent on, would have no CI coverage at all. It had none until
  # 2026-08-04.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - name: Unit tests, adapters included
        run: npm test
      - name: Fail if the adapter tests skipped, which would mean this job proves nothing
        run: |
          # The point of this job is that the optional packages ARE present. If discord.js is
          # missing the suite still passes, by skipping, so assert the coverage exists rather than
          # trusting a green tick that means the opposite.
          node -e "import('discord.js').then(() => console.log('discord.js present, adapter tests ran')).catch(() => { console.error('discord.js MISSING: the adapter tests skipped and this job proved nothing'); process.exit(1); })"

  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci --omit=optional
      - name: Install circom
        run: |
          curl -fsSL https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o "$RUNNER_TEMP/circom"
          chmod +x "$RUNNER_TEMP/circom"
          "$RUNNER_TEMP/circom" --version
      - name: Compile circuits and validate hash160 against the generator vector
        run: CIRCOM="$RUNNER_TEMP/circom" bash scripts/check_circuits.sh
      - name: PLONK prove-and-verify the members circuit end to end
        run: CIRCOM="$RUNNER_TEMP/circom" bash scripts/prove_members.sh

  # The full single-tier mno_membership PLONK setup needs a 2^20 SRS (about 1.15 GB) and is
  # too heavy for CI. It is reproducible offline via scripts/build_proving_key.sh, which
  # verifies the rebuilt key against the committed verification key. See docs/PROVING_KEY.md.
